<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 400px;
      height: 500px;
      margin: 0;
      padding: 10px;
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #00ff00;
      box-sizing: border-box;
    }
    #debug-content {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      border: 1px solid #00ff00;
      padding: 10px;
      background: #000;
      color: #00ff00;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status-connected { color: #00ff88; }
    .status-error { color: #ff4444; }
    .status-info { color: #ffaa00; }
    .status-stopped { color: #ff4444; }
    #control-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    #control-bar button {
      flex: 1;
      padding: 10px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Courier New', monospace;
    }
    #stop-btn { background: #cc3333; }
    #stop-btn.stopped { background: #2e8b57; }
    #refresh-btn { background: #4267B2; }
  </style>
</head>
<body>
  <div id="control-bar">
    <button id="stop-btn">Stop Bot</button>
    <button id="refresh-btn">Refresh</button>
  </div>
  <div id="debug-content">Initializing...</div>
  <script src="popup.js"></script>
</body>
</html>
