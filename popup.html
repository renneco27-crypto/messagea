<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 400px;
      height: 500px;
      margin: 0;
      padding: 10px;
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #00ff00;
      box-sizing: border-box;
    }
    #debug-content {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      border: 1px solid #00ff00;
      padding: 10px;
      background: #000;
      color: #00ff00;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status-connected { color: #00ff88; }
    .status-error { color: #ff4444; }
    .status-info { color: #ffaa00; }
  </style>
</head>
<body>
  <div id="debug-content">Initializing...</div>
  <script src="popup.js"></script>
